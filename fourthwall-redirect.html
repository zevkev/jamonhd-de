  :root {
    --mat: #4E9F3D;
    --paper: #fcfbf5;
    --text-dark: #1a1a1a;
    --text-muted: #4a4a40;
    --accent-red: #c0392b;
    --shadow-soft: 0 8px 20px rgba(0, 0, 0, 0.3);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background-color: var(--mat);
    background-image:
      radial-gradient(rgba(255,255,255,.08) 1.5px, transparent 1.5px);
    background-size: 26px 26px;
    padding: 48px 20px;
    font-family: "Trebuchet MS", "Futura", Arial, sans-serif;
  }
  .wrap { width: 100%; max-width: 380px; text-align: center; }
  h1 {
    font-family: "Bebas Neue", "Futura", sans-serif;
    font-size: 2.4rem; letter-spacing: 0.5px; margin: 0 0 6px;
    color: #fff;
  }
  .tagline {
    margin: 0 0 30px; color: rgba(255,255,255,.85);
    line-height: 1.5; font-size: 0.95rem;
  }

  .btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; padding: 15px 20px; margin-bottom: 14px;
    border-radius: 999px; font-weight: bold; text-decoration: none;
    font-size: 0.98rem; box-shadow: var(--shadow-soft);
    transition: transform 0.15s ease;
  }
  .btn:hover { transform: scale(1.02); }
  .btn svg { width: 20px; height: 20px; flex-shrink: 0; }

  .btn-primary {
    background: var(--paper); color: var(--text-dark);
    font-size: 1.05rem; padding: 17px 20px;
  }
  .btn-secondary {
    background: rgba(255,255,255,.14); color: #fff;
    border: 2px solid rgba(255,255,255,.35);
  }

  footer {
    margin-top: 26px; font-size: 0.78rem; color: rgba(255,255,255,.7);
  }
  footer a { color: rgba(255,255,255,.85); }
</style>
