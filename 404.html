<meta name="twitter:image" content="https://jamonhd.de/assets/img/brand/jamon.jpg">

<!--
  GitHub Pages serves this file (only from the repo root) for every path
  that has no real file, with HTTP status 404. It does three jobs:
  1. /shop/<slug> renders the product page with js/product.js (clean product
     URLs, GitHub Pages has no rewrites).
  2. Old shared links of removed pages forward to where that content lives
     now (location.replace, so the dead URL doesn't stay in the history):
     /video/<id>/ and /watch/?id=<id> to the video on YouTube, the removed
     account pages (watchlist, account, login, profil, privat, user) home.
  3. Anything else shows the "Diese Attraktion gibt es nicht" ticket.
  All asset paths are root absolute because this renders at any URL.
-->
<script>
  (function () {
    var root = document.documentElement;
    var parts = location.pathname.split("/").filter(Boolean);
    var first = (parts[0] || "").toLowerCase();
    var id = parts[1] || "";
    try { id = decodeURIComponent(id); } catch (e) {}

    function noindex() {
      var robots = document.createElement("meta");
      robots.name = "robots";
      robots.content = "noindex";
      document.head.appendChild(robots);
    }
    function youtube(videoId) {
      return "https://www.youtube.com/watch?v=" + encodeURIComponent(videoId);
    }
    function go(url) {
      root.setAttribute("data-route", "redirect");
      noindex();
      location.replace(url);
    }

    if (first === "video") {
      go(id ? youtube(id) : "/youtube/");
    } else if (first === "watch") {
      // Old player page: /watch/?id=<YouTube id>
      var wid = new URLSearchParams(location.search).get("id");
      go(wid ? youtube(wid) : "/");
    } else if (["watchlist", "account", "login", "profil", "privat", "user"].indexOf(first) !== -1) {
      go("/");
    } else if (parts[0] === "shop" && parts.length === 2 && parts[1] !== "product") {
      root.setAttribute("data-route", "product");
      document.title = "Produkt | Jamon Shop";
    } else {
      root.setAttribute("data-route", "notfound");
      noindex();
    }
  })();
</script>
</head>
<body>
<div id="site-header"></div>

<main id="main" class="page">
  <div class="container-page">
    <div id="product-root"></div>

    <section id="notfound" class="ticket notfound-ticket mx-auto mt-2 max-w-xl text-center" aria-labelledby="notfound-title" hidden>
      <div class="notfound-band">
        <p class="notfound-number" aria-hidden="true">404</p>
        <span class="stamp notfound-stamp">Geschlossen</span>
      </div>
      <hr class="ticket-perf">
      <div class="px-6 pb-10 pt-8 sm:px-12">
        <h1 id="notfound-title" class="text-4xl sm:text-5xl">Diese Attraktion gibt es nicht</h1>
        <p class="mx-auto mt-4 max-w-sm leading-relaxed text-ink-muted">Hier fährt leider nichts. Vielleicht ist der Link falsch oder schon etwas älter.</p>
        <a href="/" class="btn btn-brand btn-lg mt-7">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"/></svg>
          Zur Startseite
        </a>
        <p class="mt-8 text-sm font-semibold text-ink-muted">Oder schau hier vorbei:</p>
        <nav class="mt-3 flex flex-wrap justify-center gap-2.5" aria-label="Beliebte Seiten">
          <a href="/shop/" class="btn btn-sm">Shop</a>
          <a href="/youtube/" class="btn btn-sm">YouTube</a>
        </nav>
      </div>
    </section>
  </div>
</main>

<div id="site-footer"></div>
<script>
  (function () {
    var route = document.documentElement.getAttribute("data-route");
    if (route === "notfound") {
      document.getElementById("notfound").hidden = false;
    } else if (route === "product") {
      var s = document.createElement("script");
      s.type = "module";
      s.src = "/js/product.js";
      document.body.appendChild(s);
    }
  })();
</script>
<script type="module" src="/js/layout.js"></script>
</body>
</html>
