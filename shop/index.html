<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shop | Jamon</title>
<meta name="description" content="Der offizielle Jamon (JamonHD) Merch Shop. Hoodies, T Shirts, Caps und mehr für die Community. Sicher bestellen über Fourthwall.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://jamonhd.de/shop/">
<link rel="icon" type="image/png" href="/assets/img/brand/jamon.jpg">
<link rel="apple-touch-icon" href="/assets/img/brand/jamon.jpg">
<meta name="theme-color" content="#1f9d63">
<link rel="preload" href="/assets/fonts/figtree-latin-wght.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preconnect" href="https://storefront-api.fourthwall.com" crossorigin>
<link rel="preconnect" href="https://imgproxy.fourthwall.dev">
<link rel="stylesheet" href="/assets/css/app.css">
<script src="/js/boot.js"></script>

<meta property="og:type" content="website">
<meta property="og:title" content="Shop | Jamon (JamonHD)">
<meta property="og:description" content="Hoodies, T Shirts, Caps und mehr. Der offizielle Jamon (JamonHD) Merch Shop.">
<meta property="og:image" content="https://jamonhd.de/assets/img/brand/jamon.jpg">
<meta property="og:site_name" content="JamonHD">
<meta property="og:url" content="https://jamonhd.de/shop/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://jamonhd.de/assets/img/brand/jamon.jpg">
</head>
<body>
<div id="site-header"></div>

<main id="main" class="page">
  <div class="container-page">
    <header id="shop-ticket" class="ticket mx-auto max-w-2xl text-center">
      <div class="px-6 pb-8 pt-9 sm:px-12 sm:pt-10">
        <span class="stamp">Merch Stand</span>
        <h1 class="mt-4 text-5xl sm:text-6xl">Jamon Merch</h1>
        <p class="mx-auto mt-4 max-w-md text-lg leading-relaxed text-ink-muted">Bestickte Shirts, Hoodies und mehr für die Community. Gefertigt auf Bestellung, sicher bezahlt über Fourthwall.</p>
      </div>
      <hr class="ticket-perf" data-notch>
      <div class="px-6 pb-6 pt-5 sm:px-12">
        <p class="text-sm font-semibold text-ink-muted">Preise inkl. MwSt., zzgl. Versandkosten.</p>
        <div id="shop-promo" class="mt-4" hidden></div>
      </div>
    </header>

    <div class="mt-10 flex justify-center">
      <div id="shop-filters" class="seg max-w-full flex-nowrap overflow-x-auto [scrollbar-width:none]" role="group" aria-label="Kollektionen" hidden></div>
    </div>

    <div id="product-grid" class="mt-8 grid grid-cols-2 gap-x-3 gap-y-5 sm:gap-x-5 sm:gap-y-7 md:grid-cols-3 lg:gap-x-7 lg:gap-y-9"></div>
  </div>
</main>

<div id="site-footer"></div>
<script type="module" src="/js/layout.js"></script>
<script type="module" src="/js/catalog.js"></script>
</body>
</html>
