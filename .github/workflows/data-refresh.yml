name: Refresh YouTube feed

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch YouTube main channel feed
        # Public RSS feed, no API key needed -- see the header comment in
        # scripts/fetch-main-feed.mjs for the tradeoff this makes (capped at
        # the channel's ~15 most recent uploads, no full history). Still
        # continue-on-error so a transient feed hiccup never blocks the
        # commit step below.
        continue-on-error: true
        run: node scripts/fetch-main-feed.mjs

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/main-videos.json
          git diff --cached --quiet || git commit -m "chore: refresh video feed"
          git push
